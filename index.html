<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reproductor</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="reproductor" class="reproductor">
    <h1>🎵 Reproductor</h1>

    <div class="disco" aria-hidden="true"></div>

    <div class="info">
      <div id="cancion" class="cancion"></div>
      <p id="estado" class="estado"></p>
    </div>

    <div class="controles">
      <button id="btn-play" disabled = true>▶ Play</button>
      <button id="btn-pausa" disabled = true>⏸ Pausa</button>
      <button id="btn-siguiente">⏭ Siguiente</button>
    </div>

    <ul id="lista" class="lista"></ul>
  </main>

  <script src="app.js"></script>
</body>
</html>
